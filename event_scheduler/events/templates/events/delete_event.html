{% extends 'base.html' %}
{%block title%} Delete Event {% endblock %}

{% block content %}
<h2>Delete Element</h2>
<p>Are you sure you want to delete <b>{{event.name}}</b> 
    scheduled on {{event.date}} at {{event.time}}?
</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'my_events' %}">Cancel</a>
</form>
{% endblock %}
